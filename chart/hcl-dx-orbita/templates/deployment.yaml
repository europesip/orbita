{{- $dbHost := required "database.host is required (PostgreSQL host)" .Values.database.host }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbita.fullname" . }}-api
  labels: {{- include "orbita.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "orbita.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "orbita.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/people: {{ toJson .Values.demo.people | sha256sum | trunc 16 }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      {{- if .Values.dx.caSecret }}
      volumes:
        - name: dx-ca
          secret:
            secretName: {{ .Values.dx.caSecret }}
            items: [{ key: ca.crt, path: ca.crt }]
      {{- end }}
      containers:
        - name: liberty
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - { name: http, containerPort: 9080 }
            - { name: mcp, containerPort: 9081 }
          env:
            - { name: TZ, value: {{ .Values.api.timezone | quote }} }
            # Database (server.xml)
            - { name: ORBITA_DB_HOST, value: {{ $dbHost | quote }} }
            - { name: ORBITA_DB_PORT, value: {{ .Values.database.port | quote }} }
            - { name: ORBITA_DB_NAME, value: {{ .Values.database.name | quote }} }
            - { name: ORBITA_DB_SSLMODE, value: {{ .Values.database.sslMode | quote }} }
            - name: ORBITA_DB_USER
              valueFrom: { secretKeyRef: { name: {{ include "orbita.dbSecret" . }}, key: username } }
            - name: ORBITA_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "orbita.dbSecret" . }}, key: password } }
            # Who the user is: DX answers, with the user's own session cookie
            - { name: ORBITA_DX_URL, value: {{ include "orbita.dxUrl" . | quote }} }
            - { name: ORBITA_SESSION_COOKIE, value: {{ .Values.dx.sessionCookie | default (ternary "LtpaToken2" "LtpaToken2,WAS_n*" (eq (toString .Values.dx.oidcSupport) "false")) | quote }} }
            {{- if .Values.dx.caSecret }}
            - { name: ORBITA_DX_CA, value: /dx-ca/ca.crt }
            {{- end }}
            {{- if .Values.dx.insecureSkipTLSVerify }}
            - { name: ORBITA_DX_INSECURE, value: "true" }
            {{- end }}
            # Demo, kiosk and pages
            - { name: ORBITA_DEMO_SEED, value: {{ .Values.demo.seed | quote }} }
            - { name: ORBITA_DEMO_PEOPLE, value: {{ toJson .Values.demo.people | quote }} }
            - name: ORBITA_KIOSK_KEY
              valueFrom: { secretKeyRef: { name: {{ include "orbita.fullname" . }}-kiosk, key: key } }
            - { name: ORBITA_PAGES_BASE, value: {{ .Values.pages.base | quote }} }
            # What the apps show (ui.*): the API returns it in GET /v1/config
            - { name: ORBITA_HEADER_TITLE, value: {{ .Values.ui.header.title | quote }} }
            - { name: ORBITA_HEADER_HOMELINK, value: {{ ternary (not .Values.theme.enabled) .Values.ui.header.homeLink (eq (toString .Values.ui.header.homeLink) "auto") | toString | quote }} }
            {{- $temaBoton := and .Values.theme.enabled .Values.theme.assistantButton }}
            - { name: ORBITA_HEADER_ASSISTANT, value: {{ ternary (not $temaBoton) .Values.ui.header.assistant (eq (toString .Values.ui.header.assistant) "auto") | toString | quote }} }
            - { name: ORBITA_HEADER_NOTIFICATIONS, value: {{ .Values.ui.header.notifications | quote }} }
            - { name: ORBITA_HEADER_USER, value: {{ ternary (not .Values.theme.enabled) .Values.ui.header.user (eq (toString .Values.ui.header.user) "auto") | toString | quote }} }
            - { name: ORBITA_FOOTER, value: {{ .Values.ui.footer | quote }} }
            - { name: ORBITA_SOURCE_URL, value: {{ .Values.ui.sourceUrl | default "https://github.com/europesip/orbita" | quote }} }
            - { name: ORBITA_KIOSK_PAGE, value: {{ printf "%squiosco" .Values.pages.base | quote }} }
            # AI assistant (assistant.*)
            - { name: ORBITA_ASSISTANT, value: {{ .Values.assistant.backend | quote }} }
            {{- if eq .Values.assistant.backend "orbita" }}
            - { name: ORBITA_LLM_URL, value: {{ required "assistant.litellm.url is required with assistant.backend=orbita" .Values.assistant.litellm.url | quote }} }
            - { name: ORBITA_LLM_MODEL, value: {{ .Values.assistant.model | quote }} }
            {{- if eq .Values.assistant.backend "orbita" }}{{ with .Values.assistant.litellm.apiKeySecret }}{{ if .name }}
            # optional: without the Secret (no LiteLLM yet) ÓRBITA starts and only the chat reports the error
            - name: ORBITA_LLM_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .name }}, key: {{ .key }}, optional: true } }
            {{- end }}{{ end }}{{ end }}
            {{- with .Values.assistant.maxTokens }}
            - { name: ORBITA_LLM_MAX_TOKENS, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.assistant.temperature }}
            - { name: ORBITA_LLM_TEMPERATURE, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- with .Values.mcp.tools }}
            {{- if .enabled }}
            - { name: ORBITA_MCP_TOOLS, value: {{ join "," .enabled | quote }} }
            {{- end }}
            {{- if .disabled }}
            - { name: ORBITA_MCP_TOOLS_DISABLED, value: {{ join "," .disabled | quote }} }
            {{- end }}
            {{- if .readOnly }}
            - { name: ORBITA_MCP_READ_ONLY, value: "true" }
            {{- end }}
            {{- end }}
            {{- if .Values.mcp.tokenSecret }}
            - name: ORBITA_MCP_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.mcp.tokenSecret }}, key: token } }
            {{- end }}
          {{- if .Values.dx.caSecret }}
          volumeMounts:
            - { name: dx-ca, mountPath: /dx-ca, readOnly: true }
          {{- end }}
          startupProbe:          # first start: Liberty, then Flyway and the demo data
            httpGet: { path: /orbita-api/v1/salud, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /orbita-api/v1/salud, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
