{{- /* Always rendered: the scriptapps Job mounts it in /after-push (after-push.sh runs sitio.mjs, issue #28) */}}
{{- $mode := .Values.pages.mode | default "site" }}
{{- if not (has $mode (list "site" "home")) }}{{ fail "pages.mode must be site or home" }}{{ end }}
{{- $files := dict }}
{{- range $path, $_ := .Files.Glob "files/site/**" }}
{{- if not (hasPrefix "files/site/theme/images/" $path) }}
{{- $_ := set $files (trimPrefix "files/site/" $path) ($.Files.Get $path) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pages
  labels: {{- include "orbita.labels" . | nindent 4 }}
data:
  after-push.sh: |
{{ .Files.Get "files/after-push.sh" | indent 4 }}
  sitio.mjs: |
{{ .Files.Get "files/sitio.mjs" | indent 4 }}
  # Every file of files/site/ (theme.html, nls.json, wcm/...) except the images: path -> text
  site-files.json: {{ toJson $files | quote }}
  # The chart values the site step needs
  sitio.json: {{ toJson (dict
      "theme" (dict "enabled" .Values.theme.enabled "folder" .Values.theme.name "uniqueName" .Values.theme.uniqueName
                    "title" .Values.theme.title "base" (dict "folder" .Values.theme.base.folder "uniqueName" .Values.theme.base.uniqueName)
                    "languages" .Values.theme.languages "hclLogo" .Values.theme.hclLogo "assistantButton" .Values.theme.assistantButton)
      "libraries" .Values.theme.libraries
      "access" .Values.theme.access
      "logoBase64" .Values.theme.logoBase64
      "dryRun" .Values.theme.dryRun
      "pages" (dict "create" .Values.pages.create "mode" $mode "parent" .Values.pages.parent "site" .Values.pages.site
                    "items" .Values.pages.items "skin" .Values.pages.skin "pageTemplate" .Values.pages.pageTemplate)
      "pagesBase" (include "orbita.pagesBase" .)) | quote }}
binaryData:
  # Images of files/site/theme/images/ (logos and favicon of the theme, header and Setting fields)
  {{- range $path, $_ := .Files.Glob "files/site/theme/images/*" }}
  site-img-{{ base $path }}: {{ $.Files.Get $path | b64enc }}
  {{- end }}
