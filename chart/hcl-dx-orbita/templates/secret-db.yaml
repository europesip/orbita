{{- if not .Values.database.existingSecret }}
{{- $name := include "orbita.dbSecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "orbita.labels" . | nindent 4 }}
  annotations:
    # Created before the database Job. Hook resources are not deleted with the release: the password survives a
    # reinstall, as does the PostgreSQL user that has it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: kubernetes.io/basic-auth
data:
  username: {{ .Values.database.user | b64enc }}
  {{- if and $old $old.data $old.data.password }}
  password: {{ $old.data.password }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
