{{- if and .Values.mcp.enabled .Values.mcp.networkPolicy.enabled }}
# Who reaches the ÓRBITA pods: the API port from anywhere (the Ingress controller), the MCP port only from the
# HCL DX IQ Integrator. (kubectl port-forward goes through the kubelet and is not affected.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orbita.fullname" . }}-api
  labels: {{- include "orbita.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "orbita.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 9080, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.mcp.networkPolicy.integratorNamespace }} }
          podSelector:
            matchLabels: {{- toYaml .Values.mcp.networkPolicy.integratorPodLabels | nindent 14 }}
      ports:
        - { port: 9081, protocol: TCP }
{{- end }}
