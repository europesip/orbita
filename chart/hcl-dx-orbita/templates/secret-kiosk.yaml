{{- $name := printf "%s-kiosk" (include "orbita.fullname" .) }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "orbita.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.kiosk.key }}
  key: {{ .Values.kiosk.key | b64enc }}
  {{- else if and $old $old.data $old.data.key }}
  key: {{ $old.data.key }}
  {{- else }}
  key: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
