# INGRESS_CLASS=traefik · ${SUITE_PATH} en el mismo host que DX (https://${DX_HOST}${SUITE_PATH}), para que las Script
# Applications llamen al servicio sin CORS y el navegador envíe la cookie LtpaToken2 del portal.
# Traefik da prioridad a la regla más larga: esta (Host + PathPrefix) gana a la de DX (solo Host) del Lab 1.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${SUITE_APP}
  namespace: ${SUITE_NS}
  labels: {app: ${SUITE_APP}}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`${DX_HOST}`) && PathPrefix(`${SUITE_PATH}`)
      kind: Rule
      services:
        - name: ${SUITE_APP}
          port: 9080
  tls:
    secretName: suite-tls-cert
