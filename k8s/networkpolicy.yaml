# ÓRBITA · Quién puede llegar a los pods de suite-api (lo aplica 04-api.sh sustituyendo las variables).
#  - 9080 (API de las Script Applications): cualquiera dentro del clúster, en particular el Ingress controller.
#  - 9081 (servidor MCP): SOLO el Integrator de DX IQ (${IQ_RELEASE}-integrator en ${DX_NS}). El MCP recibe el usuario
#    como parámetro y actúa en su nombre: nadie más debe poder llamarlo. Para probarlo desde una estación de trabajo,
#    "kubectl port-forward" entra por el kubelet y no pasa por esta política.
# Para dar acceso a otro cliente MCP del clúster, añade otro bloque "from" con su namespace y sus etiquetas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${SUITE_APP}-mcp
  namespace: ${SUITE_NS}
  labels: {app: ${SUITE_APP}}
spec:
  podSelector:
    matchLabels: {app: ${SUITE_APP}}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 9080, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ${DX_NS}}
          podSelector:
            matchLabels: {app: ${IQ_RELEASE}-integrator}
      ports:
        - {port: 9081, protocol: TCP}
